      (() => {
        const tl = gsap.timeline({ paused: true });
        const root = document.getElementById("s1-root");
        const q = (s) => root.querySelector(s);
        const qa = (s) => root.querySelectorAll(s);

        // ================= TRACK 3: KINETIC TYPOGRAPHY =================
        // Each beat clip is a timed wrapper; the animated nodes are its children (never the clip itself).
        const FX = {
          rise: (k, t) => tl.from(k, { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" }, t),
          words: (k, t) => tl.from(k.querySelectorAll(".w"), { opacity: 0, y: 30, duration: 0.4, ease: "power3.out", stagger: 0.08 }, t),
          slam: (k, t) => tl.from(k, { opacity: 0, scale: 1.4, duration: 0.28, ease: "power4.out" }, t),
        };
        qa(".beat").forEach((el) => {
          const t = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration);
          FX[el.querySelector(".k").dataset.fx](el.querySelector(".k"), t);
          // nothing is ever static: a slow push-in runs for the whole life of every beat
          tl.fromTo(el.querySelector(".drift"), { scale: 1 }, { scale: 1.04, duration: d, ease: "none" }, t);
        });

        // title card
        tl.from(q("#s1-title .kicker"), { opacity: 0, y: 20, duration: 0.6 }, 38.1);
        tl.from(qa("#s1-title .tl"), { opacity: 0, y: 60, scale: 1.15, duration: 0.9, ease: "power4.out", stagger: 0.18 }, 38.2);
        tl.fromTo(q("#s1-title .rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 39.2);

        // ================= TRACK 2: AMBIENT DEPTH FIELD =================

        tl.to(qa(".d2"), { y: -290, x: -50, duration: 128, ease: "none" }, 0);
        tl.to(qa(".d3"), { y: -560, x: 80, duration: 128, ease: "none" }, 0);
        // analog film grain: stepped jitter of an oversized noise layer (~12 steps/sec)
        tl.to(q("#s1-grain"), { x: -160, y: -110, duration: 128, ease: "steps(1536)" }, 0);

        // ================= TRACK 4: 3D PARALLAX PROPS =================
        // 0-11s calendar invite: push-in, drift, shake, "no agenda" underline
        tl.from(q("#s1-cal"), { z: -1400, rotationY: -48, rotationX: 14, opacity: 0, duration: 1.7, ease: "power3.out" }, 0.15);
        tl.to(q("#s1-cal"), { rotationY: -6, rotationX: 3, z: 90, duration: 9, ease: "none" }, 1.85);
        [[5.0, 9], [5.05, -9], [5.1, 5], [5.15, 0]].forEach(([t, x]) => tl.to(q("#s1-cal-wrap"), { x, duration: 0.05, ease: "none" }, t));
        tl.fromTo(q("#s1-agenda-line"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 5.4);

        // 11-22s paperwork at three depths, then whipped past the lens

        tl.to(q("#s1-shB"), { y: -30, rotationY: -6, z: 140, duration: 8.1, ease: "none" }, 12.7);

        // ================= TRACK 7: PAPER WIPES =================
        [["#s1-wipe1", 41.4], ["#s1-wipe2", 91.4], ["#s1-wipe3", 112.4]].forEach(([s, t]) => {

          tl.to(q(s), { x: 1980, duration: 0.5, ease: "power3.out" }, t + 0.5);
        });
