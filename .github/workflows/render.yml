name: Render HyperFrames Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Run HyperFrames Render
        run: npx hyperframes render --output final-documentary.mp4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: final-documentary
          path: final-documentary.mp4
